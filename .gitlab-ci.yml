# NetOps Pipeline(Runner:主機 2 WSL shell executor,tag windows-runner;與 Gateway 同一台主機;IMPL-PLAN B0)
#   check            所有分支:netops-api、netops-web(frontend/)型別檢查、單元測試、建置;netops-pa(pa-collector/)ruff 與 pytest;
#                    netops-ingest 整合測試(check:ingest-int:一次性 Redis + ClickHouse 容器,只在 backend/ 或 deploy/clickhouse/ 有變更時)
#   deploy-api-test  develop:在主機 2 建置並更新 netops-api(加入 Gateway 網路;啟動後自動註冊路由草稿)與知識庫 NAS 備份 netops-kb-backup;
#                    PA 即時監控 netops-redis、netops-pa(R1;netops-pa 沒變更時不重建,deploy/ci-netops-pa.sh);PA log ClickHouse netops-clickhouse 與建表(C1);
#                    寫入管線 netops-ingest(C2;C4 起含每天的冷歸檔,NAS 目錄唯讀掛給 netops-clickhouse)
#   deploy-web-test  develop:建置 SPA 並發佈到 Gateway 的 gw_www(Nginx /netops/;IMPL-PLAN D1,同 GigaItApp、giga-Portal)
#   rbac-test        develop:以已部署的 Gateway 映像套用 deploy/gateway-rbac.yaml(netops.* 畫面權限、netops-admin / netops-viewer 角色;不指派成員)
# 舊版 IIS 程式(根目錄 server/、src/)不在 Pipeline 內,切換前 main 維持舊版(ARCHITECTURE D12),本檔沒有 main 的工作(正式區屬 D2)。
# 主機需有:${NETOPS_SECRETS_DIR} 機密與 ${NETOPS_ENV_FILE}(deploy/host2-set-secrets.sh 產生);Gateway 已部署(giganexus-gw_default 網路、
#           giganexus-gw_gw_www volume、Nginx /netops/ location);npm Registry Token 同其他專案(${NPM_TOKEN_FILE})
stages: [check, deploy-test, rbac-test]

variables:
  NETOPS_ENV_FILE: /srv/giganexus/deploy/netops.env
  NETOPS_SECRETS_DIR: /srv/giganexus/netops-secrets
  NPM_TOKEN_FILE: /srv/giganexus/deploy/secrets/gitlab_npm_token
  GATEWAY_DIR: /srv/giganexus/shared/giga-api-gateway-bff
  GW_TEST_ENV_FILE: /srv/giganexus/deploy/test.env

.runner: &runner
  tags: [windows-runner]

check:backend:
  <<: *runner
  stage: check
  script:
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - cd backend
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm test
    - npm run build

check:frontend:
  <<: *runner
  stage: check
  script:
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm test
    - npm run build

# netops-pa(Python,R1):在映像的 test 階段跑 ruff 與 pytest(Python 3.12,與執行映像同一個基底;假 PA、fakeredis,不連外部主機)
check:pa-collector:
  <<: *runner
  stage: check
  script:
    # --pull:同 deploy-api-test(主機上的基底映像可能被其他專案覆寫)
    - docker build --pull --target test -t "netops-pa-test:$CI_COMMIT_SHORT_SHA" pa-collector
    - docker image rm "netops-pa-test:$CI_COMMIT_SHORT_SHA" >/dev/null 2>&1 || true

# netops-ingest 整合測試(C2):一次性的 Redis 7.4 與 ClickHouse(同 Compose 的映像、設定、schema、migrations、netops_writer 帳號),
#   只發佈到 127.0.0.1 的隨機 port,跑完刪除(after_script)。帳號密碼是這個 job 臨時產生的,不用主機機密
check:ingest-int:
  <<: *runner
  stage: check
  rules:
    - changes: [backend/**/*, deploy/clickhouse/**/*, deploy/host2-set-clickhouse-secrets.sh, .gitlab-ci.yml]
  variables:
    CH_IMAGE: clickhouse/clickhouse-server:26.3.62.3
  script:
    # 暫存目錄與輸出放在 checkout 外面(/tmp/netops-int-<job>.*),不留未追蹤檔;job 輸出另存 .log,
    #   給沒有 Job 讀取權限的 AI 以 ssh 唯讀查看(保留 3 天)
    - N="netops-int-$CI_JOB_ID"; L="/tmp/$N.log"; T="$(mktemp -d)"; echo "$T" > "/tmp/$N.path"; mkdir "$T/s"
    # C4:冷歸檔的「NAS」目錄(測試寫入,ClickHouse 唯讀掛在 user_files/archive,同 Compose);容器內 uid 101 要讀得到
    - mkdir -m 755 "$T/a"
    - find /tmp -maxdepth 1 -name 'netops-int-*.log' -mtime +3 -delete 2>/dev/null || true
    - NETOPS_SECRETS_DIR="$T/s" sh deploy/host2-set-clickhouse-secrets.sh >/dev/null
    # 容器內 uid 101 要讀得到帳號檔(一次性密碼;主機上的正式檔是 101:101 / 400)
    - chmod 644 "$T/s/clickhouse/netops-users.xml"
    - D="$PWD/deploy/clickhouse"
    # 這個 job 專用的網路(不放預設 bridge);port 只發佈到 127.0.0.1
    - docker network create "$N-net" >/dev/null
    - >-
      docker run -d --name "$N-ch" --network "$N-net" --user 101:101 --memory 1536m --memory-swap 1536m --tmpfs /tmp
      -e CLICKHOUSE_SKIP_USER_SETUP=1 -p 127.0.0.1::8123
      -v "$D/config.d/low-memory.xml:/etc/clickhouse-server/config.d/zz-netops-low-memory.xml:ro"
      -v "$D/users.d/default.xml:/etc/clickhouse-server/users.d/zz-netops-default.xml:ro"
      -v "$D/users.d/profiles.xml:/etc/clickhouse-server/users.d/zz-netops-profiles.xml:ro"
      -v "$T/s/clickhouse/netops-users.xml:/etc/clickhouse-server/users.d/zz-netops-users.xml:ro"
      -v "$T/a:/var/lib/clickhouse/user_files/archive:ro"
      "$CH_IMAGE" >/dev/null
    - docker run -d --name "$N-redis" --network "$N-net" -p 127.0.0.1::6379 redis:7.4-alpine >/dev/null
    - for i in $(seq 1 60); do docker exec "$N-ch" wget -qO- http://127.0.0.1:8123/ping >/dev/null 2>&1 && break; sleep 1; done
    # 升級測試:V-a 前的舊 schema → apply-schema.sh 要成功(2026-11-12 測試區部署失敗的情況);結束時刪掉資料庫
    - sh deploy/clickhouse/test-upgrade.sh "$N-ch" 2>&1 | tee -a "$L"; test "$(tail -n 1 "$L" | cut -c1-4)" = "OK  "
    - sh deploy/clickhouse/apply-schema.sh test "$N-ch" 2>&1 | tee -a "$L"
    # migrations 可重複執行
    - sh deploy/clickhouse/apply-schema.sh test "$N-ch" >/dev/null
    - export INT_CLICKHOUSE_URL="http://127.0.0.1:$(docker port "$N-ch" 8123/tcp | head -n 1 | sed 's/.*://')"
    - export INT_REDIS_URL="redis://127.0.0.1:$(docker port "$N-redis" 6379/tcp | head -n 1 | sed 's/.*://')/0"
    - export INT_CLICKHOUSE_PASSWORD_FILE="$T/s/ch_writer_password"
    # C3:netops-api 的唯讀查詢(netops_reader)
    - export INT_CLICKHOUSE_READER_PASSWORD_FILE="$T/s/ch_reader_password"
    # C4:冷歸檔與冷明細(netops_cold 讀 file())
    - export INT_CLICKHOUSE_COLD_PASSWORD_FILE="$T/s/ch_cold_password" INT_ARCHIVE_DIR="$T/a"
    # npm Token 只給 npm ci(測試碼與相依套件的 script 讀不到;資安審查 L5)
    - (cd backend && GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")" npm ci --no-audit --no-fund)
    - (cd backend && npm run test:int) > "$L.test" 2>&1 && R=0 || R=$?; cat "$L.test" >> "$L"; tail -n 120 "$L.test"; rm -f "$L.test"; test "$R" = 0
    # 重複修正(dedupe-day.sh):同一列寫兩筆 → 修正後原始表與每小時彙總都是 1
    #   兩筆放在同一個 INSERT(同一個區塊):分兩次寫會被表的去重視窗擋掉第二次;時間先算好(昨天同一秒)
    - E=$(($(date +%s) - 86400))
    - V="(toDateTime($E), toDateTime64($E, 3), '::ffff:10.1.1.1', 'dup-test', 'dup-test', 'syslog')"
    - docker exec "$N-ch" clickhouse-client --async_insert=0 --query "INSERT INTO netops.pa_traffic_logs (event_time, received_at, src, app, src_host, source) VALUES $V, $V"
    - test "$(docker exec "$N-ch" clickhouse-client --query "SELECT count() FROM netops.pa_traffic_logs WHERE app = 'dup-test'")" = 2 || { echo "FAIL 重複列沒有寫進去" | tee -a "$L" >&2; exit 1; }
    - DD="$(docker exec "$N-ch" clickhouse-client --query "SELECT toString(toDate(event_time)) FROM netops.pa_traffic_logs WHERE app = 'dup-test' LIMIT 1")"
    - sh deploy/clickhouse/dedupe-day.sh "$N-ch" "$DD" 2>&1 | tee -a "$L"
    - R="$(docker exec "$N-ch" clickhouse-client --query "SELECT count() FROM netops.pa_traffic_logs WHERE app = 'dup-test'") $(docker exec "$N-ch" clickhouse-client --query "SELECT sum(sessions) FROM netops.pa_traffic_hourly_app WHERE app = 'dup-test'")"
    - test "$R" = "1 1" || { echo "FAIL dedupe-day.sh:原始表 / 彙總 = $R(應為 1 1)" | tee -a "$L" >&2; exit 1; }
    - echo "OK   dedupe-day.sh" | tee -a "$L"
  after_script:
    - N="netops-int-$CI_JOB_ID"; L="/tmp/$N.log"
    - echo "== job $CI_JOB_ID 結束:$CI_JOB_STATUS" >> "$L"
    - '{ echo "== clickhouse 日誌"; docker logs --tail 80 "$N-ch"; echo "== redis 日誌"; docker logs --tail 20 "$N-redis"; } >> "$L" 2>&1 || true'
    - chmod 644 "$L" 2>/dev/null || true
    - docker rm -f "$N-ch" "$N-redis" >/dev/null 2>&1 || true
    - docker network rm "$N-net" >/dev/null 2>&1 || true
    - if [ -s "/tmp/$N.path" ]; then rm -rf "$(cat "/tmp/$N.path")" "/tmp/$N.path"; fi

deploy-api-test:
  <<: *runner
  stage: deploy-test
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment: { name: test-api }
  variables:
    # 測試區 FTP 的 TRAFFIC log 在 /my-data(根目錄沒有;D1 驗收 2026-11-05 §3.1,需求方決定寫進部署設定)。
    # Compose 以 shell 環境變數優先於 --env-file,這裡的值會蓋過主機 netops.env 的 FTP_LOG_DIR。正式區另定(docs/HANDOFF.md D2 前確認)
    FTP_LOG_DIR: /my-data
    # 完整歷史:deploy/ci-netops-pa.sh 要比對正在執行的 netops-pa 是哪個 commit 建的(淺層 clone 找不到就只能重建)
    GIT_DEPTH: "0"
  script:
    - test -f "$NETOPS_ENV_FILE" || { echo "缺少 $NETOPS_ENV_FILE(先在主機 2 執行 deploy/host2-set-secrets.sh)" >&2; exit 1; }
    - for f in gw_api_key monitor_api_key ftp_password qdrant_api_key; do test -f "$NETOPS_SECRETS_DIR/$f" || { echo "缺少 netops-api 機密 $f(先在主機 2 執行 deploy/host2-set-secrets.sh)" >&2; exit 1; }; done
    # C3:netops-api 唯讀查詢 ClickHouse(deploy/host2-set-clickhouse-secrets.sh 已產生)
    - test -f "$NETOPS_SECRETS_DIR/ch_reader_password" || { echo "缺少 ch_reader_password(先在主機 2 執行 deploy/host2-set-clickhouse-secrets.sh)" >&2; exit 1; }
    # C4:冷明細與歸檔讀回核對(netops_cold;同一支腳本在 C1 已產生)
    - test -f "$NETOPS_SECRETS_DIR/ch_cold_password" || { echo "缺少 ch_cold_password(先在主機 2 執行 deploy/host2-set-clickhouse-secrets.sh)" >&2; exit 1; }
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA RELEASE_SHA=$CI_COMMIT_SHORT_SHA COMPOSE_ENV_FILES="$NETOPS_ENV_FILE"
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - C="docker compose -f deploy/docker-compose.yml"
    # --pull:主機上的 node:22-alpine 可能被其他專案覆寫(同 Gateway 2026-10-02)
    # netops-pa(R1):pa-collector/、Compose 的 netops-pa 段與 netops.env 都沒變時不重建、不重啟(重建會讓 PA-560 Syslog 斷線、不會自動重連,
    #   要網通重新 Commit;docs/PA-FORWARDING-SPEC.md F.3)。判斷在 deploy/ci-netops-pa.sh;機密或憑證檔換了,手動重跑 pipeline 時帶 NETOPS_PA_RECREATE=1
    #   要重建時先建置:建置失敗時不會只更新到一半
    - PA_PLAN="$(sh deploy/ci-netops-pa.sh || echo rebuild)"
    - if [ "$PA_PLAN" = rebuild ]; then $C build --pull netops-pa; fi
    - $C build --pull netops-api netops-kb-backup
    # 記下啟動時間:之後只看這次的日誌(同一 SHA 重跑、容器未重建時,不被舊的註冊結果誤判)
    - S="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - $C up -d --wait --force-recreate netops-api
    # 知識庫 NAS 備份:重建才看得到晚於容器掛上的 NAS;啟動時今天還沒備份就先備份一次(結果看容器日誌)
    - $C up -d --wait --force-recreate netops-kb-backup
    # PA 即時監控(R1):netops-redis(資料保留在 volume,不強制重建)與收集器 netops-pa。
    #   輪詢與接收預設關閉(netops.env 的 PA_POLL_ENABLED / PA_RECEIVE_ENABLED,測試時才開);關閉時仍會執行並寫心跳
    - for f in pa_api_key pa_http_token; do test -f "$NETOPS_SECRETS_DIR/$f" || { echo "缺少 netops-pa 機密 $f(先在主機 2 執行 deploy/host2-set-pa-secrets.sh)" >&2; exit 1; }; done
    # netops-redis 被重建(設定或映像改了)時,netops-pa 一起重建,不靠舊連線自動重連
    - R0="$($C ps -q netops-redis || true)"
    - $C up -d --wait netops-redis
    - if [ "$PA_PLAN" = keep ] && [ "$R0" != "$($C ps -q netops-redis)" ]; then echo "netops-redis 已重建,netops-pa 一起重建" >&2; PA_PLAN=rebuild; $C build --pull netops-pa; fi
    - |
      if [ "$PA_PLAN" = rebuild ]; then
        $C up -d --wait --force-recreate netops-pa
        echo "WARN netops-pa 已重建,TRAFFIC Syslog 可能需要網通重新 Commit netops-syslog(PA-560 不會自動重連;docs/PA-FORWARDING-SPEC.md F.3)"
      else
        echo "OK   netops-pa 沒有變更,沿用原容器(沒有重啟,Syslog 連線不受影響)"
      fi
    - $C exec -T netops-redis redis-cli config get maxmemory-policy | grep -q noeviction || { echo "FAIL netops-redis 不是 noeviction" >&2; exit 1; }
    - $C exec -T netops-redis redis-cli config get appendonly | grep -qx no || { echo "FAIL netops-redis AOF 應關閉" >&2; exit 1; }
    - $C exec -T netops-redis redis-cli config get save | grep -q '3600 1' || { echo "FAIL netops-redis RDB save 設定不符" >&2; exit 1; }
    - $C exec -T netops-redis redis-cli config get maxmemory | tail -n 1 | grep -q '^[1-9]' || { echo "FAIL netops-redis 沒有 maxmemory" >&2; exit 1; }
    - echo "OK   netops-redis / netops-pa"
    # PA log ClickHouse(C1):每次重建(資料在 volume,中斷數秒)。掛載的設定檔內容改了 Compose 不會自動重建,
    #   單檔 bind mount 在 checkout 換檔後容器也讀不到新檔,所以一律 --force-recreate。建表與 TTL 可重複執行(測試區 3 天)
    - test -f "$NETOPS_SECRETS_DIR/clickhouse/netops-users.xml" || { echo "缺少 ClickHouse 帳號檔(先在主機 2 執行 deploy/host2-set-clickhouse-secrets.sh)" >&2; exit 1; }
    - $C up -d --wait --force-recreate netops-clickhouse
    - sh deploy/clickhouse/apply-schema.sh test "$($C ps -q netops-clickhouse)"
    - $C exec -T netops-clickhouse clickhouse-client --query "SELECT value FROM system.server_settings WHERE name = 'max_server_memory_usage'" | awk '$1 > 0 && $1 <= 1288490188 {ok=1} END {exit !ok}' || { echo "FAIL netops-clickhouse 記憶體上限不符(應 ≤ 1.2 GB)" >&2; exit 1; }
    - echo "OK   netops-clickhouse"
    # PA log 寫入管線(C2):netops-ingest(netops-api 同映像)。重建時未 ACK 的批次留在 Redis 待處理清單,啟動後先補(去重 token 相同,不重複)
    - test -f "$NETOPS_SECRETS_DIR/ch_writer_password" || { echo "缺少 ch_writer_password(先在主機 2 執行 deploy/host2-set-clickhouse-secrets.sh)" >&2; exit 1; }
    # 心跳要是這一版、這次部署之後啟動的(同一個 commit 重跑 pipeline 時舊心跳的 release 也相同)、狀態 ok
    #   (啟動檢查 ClickHouse 帳密與 consumer group 都過了才是 ok),最多等 60 秒
    - SI="$(date -u +%Y-%m-%dT%H:%M:%S)"
    - $C up -d --wait --force-recreate netops-ingest
    - |
      for i in $(seq 1 30); do
        HB="$($C exec -T netops-redis redis-cli hmget netops:ingest:heartbeat release state startedAt | paste -sd ' ' -)" || HB=""
        set -- $HB
        if [ "${1:-}" = "$CI_COMMIT_SHORT_SHA" ] && [ "${2:-}" = ok ] && [ "$(printf '%s\n%s\n' "$SI" "${3:-}" | sort | head -n 1)" = "$SI" ]; then
          echo "OK   netops-ingest($HB)"
          # 冷歸檔(C4):只顯示狀態不擋部署(nas-missing = 需求方還沒執行 deploy/host2-setup-pa-archive.sh;late = 逾期未歸檔)
          echo "INFO 冷歸檔:$($C exec -T netops-redis redis-cli hmget netops:ingest:heartbeat archiveState archiveLastOk:traffic archiveLateCount archiveError | paste -sd ' ' -)"
          break
        fi
        [ "$i" = 30 ] && { echo "FAIL netops-ingest 心跳不是這次部署的或狀態異常:$HB" >&2; $C logs --tail 20 netops-ingest >&2; exit 1; }
        sleep 2
      done
    # 冒煙測試:健康檢查(/healthz、/readyz 不進 giga-observe 監控)。
    #   原本另打一次不帶內部 Token 的 /v1/ping 確認回 401,但每次部署都在 giga-observe 留一筆 401(2026-11-09 驗收 §4.5),
    #   改由單元測試涵蓋(backend/test/unit/app.test.ts「缺少 Token 回 401 NETOPS_INTERNAL_TOKEN_INVALID」)
    - $C exec -T netops-api wget -qO- http://127.0.0.1:51292/healthz
    - $C exec -T netops-api wget -qO- http://127.0.0.1:51292/readyz
    # 自動註冊在背景執行(SDK 失敗時重試 1、2、4、8、16 秒,另加連線逾時);最多等 90 秒看最終結果,重試用完仍失敗時 job 失敗
    # 訊息取自 @giganexus/backend-sdk 0.3:成功「API 已註冊…」,最終失敗「…Gateway 路由未更新」
    - |
      for i in $(seq 1 45); do
        L="$($C logs --since "$S" netops-api 2>&1)"
        if echo "$L" | grep -q 'Gateway 路由未更新'; then echo "$L" | grep '自動註冊' | tail -10; exit 1; fi
        if echo "$L" | grep -q 'API 已註冊'; then echo "$L" | grep 'API 已註冊' | tail -1; exit 0; fi
        sleep 2
      done
      echo "90 秒內沒有看到自動註冊結果" >&2; $C logs --since "$S" netops-api 2>&1 | tail -20; exit 1

deploy-web-test:
  <<: *runner
  stage: deploy-test
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  # 同一個 compose project:等後端部署完才發佈,不與 deploy-api-test 同時執行;後端失敗時不發佈前端
  needs: [deploy-api-test]
  environment: { name: test, url: https://giganexus-test.gigasolar.com.tw/netops/ }
  script:
    - test -f "$NETOPS_ENV_FILE" || { echo "缺少 $NETOPS_ENV_FILE(先在主機 2 執行 deploy/host2-set-secrets.sh)" >&2; exit 1; }
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA RELEASE_SHA=$CI_COMMIT_SHORT_SHA COMPOSE_ENV_FILES="$NETOPS_ENV_FILE"
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - P="docker compose -f deploy/docker-compose.yml --profile publish"
    # --pull:同 deploy-api-test
    - $P build --pull spa-netops
    # 發佈到 gw_www 的 netops(保留上一版供回滾:$P run --rm spa-netops rollback netops)
    - $P run --rm spa-netops
    # 冒煙測試(經 Gateway Nginx):/netops/ 與深層路由都回本系統的 index.html(引用 /netops/assets/);
    # Gateway 尚未加 /netops/ location 時會落到入口網的 index.html,這裡就會失敗
    - |
      for u in /netops/ /netops/firewall/dashboard; do
        curl -skf "https://127.0.0.1$u" | grep -q '/netops/assets/' || { echo "FAIL $u 不是 NetOps 的 index.html(Gateway /netops/ location?)" >&2; exit 1; }
        echo "OK   $u"
      done
    # 失敗要讓 job 失敗:不用「A | B && echo」(&& 左側失敗不會中止 job)
    - curl -sk -o /dev/null -w '%{http_code}\n' https://127.0.0.1/api/auth/me | grep -q 401 || { echo "FAIL /api/auth/me 不是 401" >&2; exit 1; }
    - echo "OK   /api/auth/me → 401(單一入口)"

rbac-test:
  <<: *runner
  stage: rbac-test
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # 與測試區 Gateway 相同的映像(Gateway deploy-test 記錄);GATEWAY_DIR 為 Gateway 共用目錄(含 deploy/)
    # 在 deploy-api-test 之後:includes 綁的 netops.* API 權限由 netops-api 啟動時自動註冊建立
    - export IMAGE_TAG="$(cat "$(dirname "$GATEWAY_DIR")/gateway-image-tag")" REGISTRY=10.10.130.123:5050/giganexus/giga-api-gateway-bff
    - sh deploy/apply-gateway-rbac.sh test "$GW_TEST_ENV_FILE"
