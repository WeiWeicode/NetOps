# NetOps Pipeline(Runner:主機 2 WSL shell executor,tag windows-runner;與 Gateway 同一台主機;IMPL-PLAN B0)
#   check            所有分支:netops-api、netops-web(frontend/)型別檢查、單元測試、建置
#   deploy-api-test  develop:在主機 2 建置並更新 netops-api(加入 Gateway 網路);啟動後自動註冊路由草稿
# 只部署 netops-api;SPA 只做檢查不部署(F1),SPA 部署、gateway-rbac.yaml、Nginx /netops/ location 於 D1 加入。
# 舊版 IIS 程式(根目錄 server/、src/)不在 Pipeline 內,切換前 main 維持舊版(ARCHITECTURE D12),本檔沒有 main 的工作。
# 主機需有:${NETOPS_SECRETS_DIR} 機密與 ${NETOPS_ENV_FILE}(deploy/host2-set-secrets.sh 產生);Gateway 已部署(giganexus-gw_default 網路);
#           npm Registry Token 同其他專案(${NPM_TOKEN_FILE})
stages: [check, deploy-test]

variables:
  NETOPS_ENV_FILE: /srv/giganexus/deploy/netops.env
  NETOPS_SECRETS_DIR: /srv/giganexus/netops-secrets
  NPM_TOKEN_FILE: /srv/giganexus/deploy/secrets/gitlab_npm_token

.runner: &runner
  tags: [windows-runner]

check:backend:
  <<: *runner
  stage: check
  script:
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - cd backend
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm test
    - npm run build

check:frontend:
  <<: *runner
  stage: check
  script:
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm test
    - npm run build

deploy-api-test:
  <<: *runner
  stage: deploy-test
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment: { name: test-api }
  script:
    - test -f "$NETOPS_ENV_FILE" || { echo "缺少 $NETOPS_ENV_FILE(先在主機 2 執行 deploy/host2-set-secrets.sh)" >&2; exit 1; }
    - for f in gw_api_key monitor_api_key ftp_password; do test -f "$NETOPS_SECRETS_DIR/$f" || { echo "缺少 netops-api 機密 $f(先在主機 2 執行 deploy/host2-set-secrets.sh)" >&2; exit 1; }; done
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA RELEASE_SHA=$CI_COMMIT_SHORT_SHA COMPOSE_ENV_FILES="$NETOPS_ENV_FILE"
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - C="docker compose -f deploy/docker-compose.yml"
    # --pull:主機上的 node:22-alpine 可能被其他專案覆寫(同 Gateway 2026-10-02)
    - $C build --pull netops-api
    # 記下啟動時間:之後只看這次的日誌(同一 SHA 重跑、容器未重建時,不被舊的註冊結果誤判)
    - S="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - $C up -d --wait --force-recreate netops-api
    # 冒煙測試:健康檢查;無內部 Token → 401
    - $C exec -T netops-api wget -qO- http://127.0.0.1:51292/readyz
    - '$C exec -T netops-api node -e "fetch(\"http://127.0.0.1:51292/v1/ping\").then((r) => process.exit(r.status === 401 ? 0 : 1))" && echo "OK   /v1/ping 無內部 Token → 401"'
    # 自動註冊在背景執行(SDK 失敗時重試 1、2、4、8、16 秒,另加連線逾時);最多等 90 秒看最終結果,重試用完仍失敗時 job 失敗
    # 訊息取自 @giganexus/backend-sdk 0.3:成功「API 已註冊…」,最終失敗「…Gateway 路由未更新」
    - |
      for i in $(seq 1 45); do
        L="$($C logs --since "$S" netops-api 2>&1)"
        if echo "$L" | grep -q 'Gateway 路由未更新'; then echo "$L" | grep '自動註冊' | tail -10; exit 1; fi
        if echo "$L" | grep -q 'API 已註冊'; then echo "$L" | grep 'API 已註冊' | tail -1; exit 0; fi
        sleep 2
      done
      echo "90 秒內沒有看到自動註冊結果" >&2; $C logs --since "$S" netops-api 2>&1 | tail -20; exit 1
