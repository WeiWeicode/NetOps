# netops-pa(NetOps R1):只用來放工具設定;執行相依見 requirements.txt
[project]
name = "netops-pa"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "N", "A"]
# S101:pytest 用 assert;RUF001 類全形字元在註解內是正常的
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE", "N"]
